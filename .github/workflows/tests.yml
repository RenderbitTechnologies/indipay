name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Laravel 10 and newer run on the PHPUnit that composer.json requires
        # (10.5 or 11) with phpunit.xml. Older Laravel needs an older Testbench
        # and PHPUnit, which `legacy` pairs with phpunit.legacy.xml and
        # PHPUnit-annotation data providers. Each Laravel release is tested on
        # the oldest and newest PHP the package has been verified with.
        include:
          - { php: '8.1', laravel: '10.*', testbench: '8.*' }
          - { php: '8.2', laravel: '11.*', testbench: '9.*' }
          - { php: '8.3', laravel: '11.*', testbench: '9.*' }
          - { php: '8.4', laravel: '11.*', testbench: '9.*' }
          - { php: '8.2', laravel: '12.*', testbench: '10.*' }
          - { php: '8.3', laravel: '12.*', testbench: '10.*' }
          - { php: '8.4', laravel: '12.*', testbench: '10.*' }
          - { php: '8.0', laravel: '9.*', testbench: '7.*', phpunit: '^9.5', legacy: true }
          - { php: '8.3', laravel: '9.*', testbench: '7.*', phpunit: '^9.5', legacy: true }
          - { php: '7.3', laravel: '8.*', testbench: '6.*', phpunit: '^9.3', legacy: true }
          - { php: '8.1', laravel: '8.*', testbench: '6.*', phpunit: '^9.3', legacy: true }
          - { php: '7.2', laravel: '7.*', testbench: '5.*', phpunit: '^8.4|^9.0', legacy: true }
          - { php: '8.0', laravel: '7.*', testbench: '5.*', phpunit: '^8.4|^9.0', legacy: true }
          - { php: '7.2', laravel: '6.*', testbench: '4.*', phpunit: '^8.0', legacy: true }
          - { php: '8.0', laravel: '6.*', testbench: '4.*', phpunit: '^8.0', legacy: true }
          - { php: '7.1', laravel: '5.8.*', testbench: '3.8.*', phpunit: '^7.5', legacy: true }
          - { php: '7.4', laravel: '5.8.*', testbench: '3.8.*', phpunit: '^7.5', legacy: true }
          - { php: '7.1', laravel: '5.7.*', testbench: '3.7.*', phpunit: '^7.0', legacy: true }
          - { php: '7.3', laravel: '5.7.*', testbench: '3.7.*', phpunit: '^7.0', legacy: true }
          - { php: '7.1', laravel: '5.6.*', testbench: '3.6.*', phpunit: '^7.0', legacy: true }
          - { php: '7.3', laravel: '5.6.*', testbench: '3.6.*', phpunit: '^7.0', legacy: true }

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, curl
          coverage: none

      - name: Install dependencies
        run: |
          if [ "${{ matrix.legacy }}" = "true" ]; then
            # The old Laravel, Carbon and PHPUnit releases these jobs test have
            # known security advisories, which Composer 2.9+ refuses to install
            # unless told otherwise. Carbon 1 also ships a plugin that Composer
            # must be told not to run.
            export COMPOSER_NO_SECURITY_BLOCKING=1
            composer config --no-plugins allow-plugins.kylekatarnls/update-helper false
          fi
          composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
          if [ -n "${{ matrix.phpunit }}" ]; then
            composer require --dev "phpunit/phpunit:${{ matrix.phpunit }}" --no-update --no-interaction
          fi
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Convert data providers for PHPUnit before 10
        if: matrix.legacy
        run: .github/scripts/legacy-data-providers.sh

      - name: Run tests
        run: vendor/bin/phpunit ${{ matrix.legacy && '--configuration phpunit.legacy.xml' || '' }}
